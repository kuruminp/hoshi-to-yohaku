name: Build daily horoscope

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the existing test suite
        run: python -m unittest discover -s tests -v
      - name: Generate the daily static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build.py
      - name: Store the deployable site artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-to-yohaku-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
      # Keep a scheduled workflow active on repositories that otherwise have
      # no source commits for an extended period. This file contains no secrets.
      - name: Record the successful scheduled build
        if: github.event_name == 'schedule'
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-scheduled-build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-scheduled-build.txt
          git commit -m 'chore: record daily site build [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo 'Build succeeded; the scheduled-build record could not be pushed.'

      - name: Trigger Cloudflare Pages daily rebuild
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "Deploy Hook secret is missing"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$CLOUDFLARE_DEPLOY_HOOK"

  deploy-cloudflare-pages:
    needs: build
    if: ${{ vars.CLOUDFLARE_PAGES_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Python for configuration checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check production deployment settings
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$SITE_URL" || { echo 'Set the SITE_URL Actions variable.' >&2; exit 1; }
          case "$SITE_URL" in https://*) ;; *) echo 'SITE_URL must start with https://.' >&2; exit 1 ;; esac
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set the CLOUDFLARE_ACCOUNT_ID Actions secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the CLOUDFLARE_API_TOKEN Actions secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo 'Set the CLOUDFLARE_PAGES_PROJECT Actions variable.' >&2; exit 1; }
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: hoshi-to-yohaku-site
          path: dist/
      - name: Deploy to the commercial static host
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.event.repository.default_branch }}
